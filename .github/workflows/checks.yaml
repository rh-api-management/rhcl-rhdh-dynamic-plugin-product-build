name: Checks
on:
  push:
    paths:
      - kuadrant-backstage-plugin
      - packaging/.yarnrc.yml
      - packaging/yarn.lock
  pull_request:
    paths:
      - kuadrant-backstage-plugin
      - packaging/.yarnrc.yml
      - packaging/yarn.lock
jobs:
  verify:
    name: Check packaging lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install from packaging lockfile
        working-directory: packaging
        run: yarn install --immutable
      - name: Fail if lockfile changed
        run: |
          if ! git diff --exit-code packaging/yarn.lock; then
            echo ""
            echo "packaging/yarn.lock is out of sync with the plugin package.json files."
            echo "Run 'yarn install' in the packaging/ directory and commit the result."
            exit 1
          fi
