# This is a JavaScript-only dynamic plugin image — the build output is
# architecture-agnostic JS files. Only x64 packages are needed for the
# build tooling (TypeScript compiler, esbuild, etc.) that runs in CI.
supportedArchitectures:
  cpu:
    - x64
  os:
    - linux

nodeLinker: node-modules

# Do NOT set yarnPath - hermeto uses its own Yarn v4, and the Containerfile
# installs Yarn 4.12.0 globally. The submodule's vendored Yarn 3.8.7 should
# not be used during hermetic builds.