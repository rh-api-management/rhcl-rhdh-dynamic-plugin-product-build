# Standalone prefetch/build overlay over the kuadrant-backstage-plugin submodule.
# Everything except this file is a symlink into the submodule, so we reuse the
# submodule's frozen, upstream-tested yarn.lock (no regeneration, no drift) while
# overriding supportedArchitectures to x64 Linux only — the submodule's own
# .yarnrc.yml is multi-arch (x64+arm64, linux+darwin), which would bloat/OOM the
# hermetic cachi2 prefetch. cachi2 prefetches from here; build.sh builds here too.
nodeLinker: node-modules
enableScripts: false
enableGlobalCache: true
supportedArchitectures:
  cpu:
    - x64
  os:
    - linux
